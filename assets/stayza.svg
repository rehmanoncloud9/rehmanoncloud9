<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="Stayza: student hostel discovery platform. Two-tier verification, zero commission, 8 cities. Timeline: ideation 2024 to 2025, architecture mid 2025, launch early 2026, national expansion next."><title>Stayza: student hostel discovery platform. Two-tier verification, zero commission, 8 cities. Timeline: ideation 2024 to 2025, architecture mid 2025, launch early 2026, national expansion next.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif}@keyframes tw{50%{opacity:.2}}.t{animation:tw 5s ease-in-out infinite}@keyframes up{from{opacity:0;transform:translateY(14px)}}.u{animation:up .9s cubic-bezier(.16,1,.3,1) both}@keyframes fl{from{transform:translateY(0);opacity:0}20%{opacity:1}to{transform:translateY(var(--d,200px));opacity:.15}}.f{animation:fl 4s cubic-bezier(.55,0,1,1) infinite}@keyframes br{50%{opacity:.55}}.b{animation:br 6s ease-in-out infinite}@keyframes rp{from{transform:scale(.4);opacity:.8}to{transform:scale(1.7);opacity:0}}.rp{transform-box:fill-box;transform-origin:center;animation:rp 3.6s ease-out infinite}@keyframes rt{to{transform:rotate(360deg)}}.rt{transform-box:fill-box;transform-origin:center;animation:rt 20s linear infinite}@keyframes eq{50%{transform:scaleY(.3)}}.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.2s ease-in-out infinite}@keyframes rl{to{transform:translateX(-40px)}}.rl{animation:rl 1s linear infinite}@keyframes sd{0%{transform:translateX(0);opacity:1}55%{transform:translateX(300px);opacity:1}70%,100%{transform:translateX(300px);opacity:0}}.sd{animation:sd 4s ease-in-out infinite}@keyframes hv{50%{transform:translateY(-4px)}}.hv{animation:hv 5s ease-in-out infinite}@keyframes gr{from{transform:scaleX(0)}}.gr{transform-box:fill-box;transform-origin:left;animation:gr 2s cubic-bezier(.5,0,.2,1) .4s both}@keyframes pp{from{opacity:0;transform:scale(.3)}}.pp{transform-box:fill-box;transform-origin:center;animation:pp .6s cubic-bezier(.3,1.5,.5,1) both}@keyframes sl{from{transform:translateX(0);opacity:0}15%{opacity:1}to{transform:translateX(750px);opacity:0}}.sl{animation:sl 4s ease-in-out 2.4s infinite}.sh{animation:sw 10s ease-in-out infinite}@keyframes sw{0%,55%{transform:translateX(-200px) skewX(-20deg)}100%{transform:translateX(1100px) skewX(-20deg)}}.d{stroke-dasharray:1 1;animation:dr 6s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:1}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1f27" stop-opacity="1"/><stop offset="1" stop-color="#111319" stop-opacity="1"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b0f" stop-opacity="1"/><stop offset="1" stop-color="#181b22" stop-opacity="1"/></linearGradient><linearGradient id="e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/><stop offset="1" stop-color="#fff" stop-opacity="0.2"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc371" stop-opacity="1"/><stop offset="0.5" stop-color="#ff5e8a" stop-opacity="1"/><stop offset="1" stop-color="#7c5cff" stop-opacity="1"/></linearGradient><radialGradient id="g"><stop offset="0" stop-color="#ff5e8a" stop-opacity="0.55"/><stop offset="1" stop-color="#ff5e8a" stop-opacity="0"/></radialGradient><filter id="n" x="-8%" y="-8%" width="120%" height="125%"><feDropShadow dx="-5" dy="-5" stdDeviation="6" flood-color="#303542" flood-opacity=".5"/><feDropShadow dx="7" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".75"/></filter></defs><rect x="10" y="10" width="1180" height="490" rx="44" fill="url(#s)" filter="url(#n)"/><rect x="10.5" y="10.5" width="1179" height="489" rx="44" fill="none" stroke="url(#e)" stroke-opacity=".5"/><path class="d" d="M56 18C56 10 20 10 20 28C20 44 60 44 60 62C60 72 40 76 24 70" pathLength="1" transform="translate(70 52)" fill="none" stroke="url(#a)" stroke-width="6" stroke-linecap="round"/><text x="150" y="98" font-size="34" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.8">Stayza</text><text x="150" y="126" font-size="16" font-weight="500" fill="rgba(245,245,247,.62)" text-anchor="start" letter-spacing="0">Student hostel discovery platform</text><g class="u" style="animation-delay:.2s"><text x="64" y="204" font-size="42" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1.2">Discover verified accommodation</text><text x="64" y="252" font-size="42" font-weight="700" fill="rgba(245,245,247,.45)" text-anchor="start" letter-spacing="-1.2">with confidence, transparency, and ease.</text></g><g class="u" style="animation-delay:0.4s"><rect x="64" y="284" width="352" height="104" rx="22" fill="url(#w)"/><rect x="64.5" y="284.5" width="351" height="103" rx="22" fill="none" stroke="#fff" stroke-opacity=".06"/><text x="92" y="340" font-size="46" font-weight="700" fill="url(#a)" text-anchor="start" letter-spacing="-1">2</text><text x="164" y="322" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">tier verification</text><text x="164" y="344" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="start" letter-spacing="0">Identity and location checks</text><text x="164" y="362" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="start" letter-spacing="0">plus a live video call.</text></g><g class="u" style="animation-delay:0.55s"><rect x="432" y="284" width="352" height="104" rx="22" fill="url(#w)"/><rect x="432.5" y="284.5" width="351" height="103" rx="22" fill="none" stroke="#fff" stroke-opacity=".06"/><text x="460" y="340" font-size="46" font-weight="700" fill="url(#a)" text-anchor="start" letter-spacing="-1">0%</text><text x="532" y="322" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">commission</text><text x="532" y="344" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="start" letter-spacing="0">Owners and students connect</text><text x="532" y="362" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="start" letter-spacing="0">directly.</text></g><g class="u" style="animation-delay:0.7s"><rect x="800" y="284" width="352" height="104" rx="22" fill="url(#w)"/><rect x="800.5" y="284.5" width="351" height="103" rx="22" fill="none" stroke="#fff" stroke-opacity=".06"/><text x="828" y="340" font-size="46" font-weight="700" fill="url(#a)" text-anchor="start" letter-spacing="-1">8</text><text x="900" y="322" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="0">cities</text><text x="900" y="344" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="start" letter-spacing="0">Lahore, Karachi, Islamabad,</text><text x="900" y="362" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="start" letter-spacing="0">Rawalpindi and more.</text></g><rect x="100" y="434" width="1000" height="3" fill="url(#w)"/><rect class="gr" x="100" y="434" width="750" height="3" fill="url(#a)"/><circle class="sl" cx="100" cy="435.5" r="5" fill="#fff"/><circle class="pp" style="animation-delay:0.6s" cx="100" cy="436" r="7" fill="#ffc371" stroke="#ff5e8a" stroke-width="2"/><text x="100" y="466" font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0">2024–25</text><text x="100" y="486" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="middle" letter-spacing="0">Ideation and validation</text><circle class="pp" style="animation-delay:1.1s" cx="433" cy="436" r="7" fill="#ffc371" stroke="#ff5e8a" stroke-width="2"/><text x="433" y="466" font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0">Mid 2025</text><text x="433" y="486" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="middle" letter-spacing="0">Platform architecture</text><circle class="pp" style="animation-delay:1.6s" cx="767" cy="436" r="7" fill="#ffc371" stroke="#ff5e8a" stroke-width="2"/><text x="767" y="466" font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0">Early 2026</text><text x="767" y="486" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="middle" letter-spacing="0">Launch</text><circle class="pp" style="animation-delay:2.1s" cx="1100" cy="436" r="7" fill="#0b0c10" stroke="#ff5e8a" stroke-width="2"/><text x="1100" y="466" font-size="14" font-weight="600" fill="#f5f5f7" text-anchor="middle" letter-spacing="0">Next</text><text x="1100" y="486" font-size="13" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="middle" letter-spacing="0">National expansion</text></svg>