<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 84" width="300" height="84" role="img" aria-label="Portfolio"><title>Portfolio</title><style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif}@keyframes tw{50%{opacity:.2}}.t{animation:tw 5s ease-in-out infinite}@keyframes up{from{opacity:0;transform:translateY(14px)}}.u{animation:up .9s cubic-bezier(.16,1,.3,1) both}@keyframes fl{from{transform:translateY(0);opacity:0}20%{opacity:1}to{transform:translateY(var(--d,200px));opacity:.15}}.f{animation:fl 4s cubic-bezier(.55,0,1,1) infinite}@keyframes br{50%{opacity:.55}}.b{animation:br 6s ease-in-out infinite}@keyframes rp{from{transform:scale(.4);opacity:.8}to{transform:scale(1.7);opacity:0}}.rp{transform-box:fill-box;transform-origin:center;animation:rp 3.6s ease-out infinite}@keyframes rt{to{transform:rotate(360deg)}}.rt{transform-box:fill-box;transform-origin:center;animation:rt 20s linear infinite}@keyframes eq{50%{transform:scaleY(.3)}}.eq{transform-box:fill-box;transform-origin:center;animation:eq 1.2s ease-in-out infinite}@keyframes rl{to{transform:translateX(-40px)}}.rl{animation:rl 1s linear infinite}@keyframes sd{0%{transform:translateX(0);opacity:1}55%{transform:translateX(300px);opacity:1}70%,100%{transform:translateX(300px);opacity:0}}.sd{animation:sd 4s ease-in-out infinite}@keyframes hv{50%{transform:translateY(-4px)}}.hv{animation:hv 5s ease-in-out infinite}@keyframes gr{from{transform:scaleX(0)}}.gr{transform-box:fill-box;transform-origin:left;animation:gr 2s cubic-bezier(.5,0,.2,1) .4s both}@keyframes pp{from{opacity:0;transform:scale(.3)}}.pp{transform-box:fill-box;transform-origin:center;animation:pp .6s cubic-bezier(.3,1.5,.5,1) both}@keyframes sl{from{transform:translateX(0);opacity:0}15%{opacity:1}to{transform:translateX(750px);opacity:0}}.sl{animation:sl 4s ease-in-out 2.4s infinite}.sh{animation:sw 10s ease-in-out infinite}@keyframes sw{0%,55%{transform:translateX(-200px) skewX(-20deg)}100%{transform:translateX(1100px) skewX(-20deg)}}.d{stroke-dasharray:1 1;animation:dr 6s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:1}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1f27" stop-opacity="1"/><stop offset="1" stop-color="#111319" stop-opacity="1"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0b0f" stop-opacity="1"/><stop offset="1" stop-color="#181b22" stop-opacity="1"/></linearGradient><linearGradient id="e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.04"/><stop offset="1" stop-color="#fff" stop-opacity="0.2"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc371" stop-opacity="1"/><stop offset="0.5" stop-color="#ff5e8a" stop-opacity="1"/><stop offset="1" stop-color="#7c5cff" stop-opacity="1"/></linearGradient><radialGradient id="g"><stop offset="0" stop-color="#ff5e8a" stop-opacity="0.55"/><stop offset="1" stop-color="#ff5e8a" stop-opacity="0"/></radialGradient><filter id="n" x="-8%" y="-8%" width="120%" height="125%"><feDropShadow dx="-5" dy="-5" stdDeviation="6" flood-color="#303542" flood-opacity=".5"/><feDropShadow dx="7" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".75"/></filter></defs><g class="u"><rect x="8" y="8" width="284" height="68" rx="24" fill="url(#s)" filter="url(#n)"/><rect x="8.5" y="8.5" width="283" height="67" rx="24" fill="none" stroke="url(#e)" stroke-opacity=".5"/><text x="34" y="49" font-size="18" font-weight="600" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.2">Portfolio</text><text x="264" y="49" font-size="18" font-weight="400" fill="rgba(245,245,247,.62)" text-anchor="end" letter-spacing="0">↗</text></g></svg>